services:
  worker:
    profiles: ["local-python"]
    build:
      context: .
      dockerfile: apps/intelligence/Dockerfile.local
    env_file:
      - path: .env
      - path: .env.worker.local
        required: false
    volumes:
      - type: bind
        source: ./apps/intelligence/.models
        target: /workspace/apps/intelligence/.models
        read_only: true
        bind:
          create_host_path: false
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      renderer:
        condition: service_started

  intelligence-http:
    profiles: ["local-python"]
    build:
      context: .
      dockerfile: apps/intelligence/Dockerfile.local
    env_file:
      - path: .env
      - path: .env.worker.local
        required: false
    volumes:
      - type: bind
        source: ./apps/intelligence/.models
        target: /workspace/apps/intelligence/.models
        read_only: true
        bind:
          create_host_path: false
    command: ["http"]
    ports:
      - "127.0.0.1:${INTELLIGENCE_HTTP_PORT:-8000}:${INTELLIGENCE_HTTP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  renderer:
    profiles: ["local-python"]
    build:
      context: .
      dockerfile: apps/intelligence/Dockerfile.renderer
    env_file:
      - path: .env.renderer.local
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128
    shm_size: 128m
