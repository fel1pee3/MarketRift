[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marketrift-intelligence"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["bullmq>=2,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "jsonschema>=4.23,<5", "pydantic>=2.10,<3", "langchain-openai>=1,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
embeddings = ["sentence-transformers>=3,<6", "huggingface-hub>=0.30,<2"]

[tool.setuptools.packages.find]
include = ["marketrift_intelligence*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
